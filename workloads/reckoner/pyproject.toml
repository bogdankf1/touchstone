[project]
name = "reckoner"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.69,<1",
    "fastapi>=0.115,<1",
    "jsonschema[format]>=4,<5",
    "litellm>=1.78,<2",
    "psycopg[binary]>=3,<4",
    "uvicorn>=0.30,<1",
]

[project.scripts]
reckoner = "reckoner.cli:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reckoner"]
