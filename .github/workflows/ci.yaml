name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: uv run --frozen --all-packages pytest -m 'not integration and not clickhouse_integration' -q
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_PASSWORD: ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
          --memory 512m
    env:
      RECKONER_TEST_OWNER_DSN: postgresql://postgres:ci-disposable-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --frozen
      # Each fixture provisions isolated login roles and runs checksum-verified migrations.
      - run: uv run --frozen --all-packages pytest -m integration -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run lint && npm run typecheck && npm run build
        working-directory: web
  platform-smoke:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - name: Fabricated OTLP-to-dashboard smoke without provider credentials
        run: bash infra/smoke-platform.sh
  image-smoke:
    runs-on: ubuntu-latest
    needs: [test, postgres-integration]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fabricated Compose smoke with zero provider credentials
        shell: bash
        run: |
          export RECKONER_SECRET_DIR="$RUNNER_TEMP/reckoner-smoke-secrets"
          export RECKONER_EXPORT_DIR="$RUNNER_TEMP/reckoner-smoke-evidence"
          python3 infra/smoke_credentials.py "$RECKONER_SECRET_DIR" --database reckoner_smoke_compose
          bash infra/smoke-compose.sh
      - name: Remove only the disposable CI project
        if: always()
        shell: bash
        run: |
          export RECKONER_SECRET_DIR="$RUNNER_TEMP/reckoner-smoke-secrets"
          export RECKONER_EXPORT_DIR="$RUNNER_TEMP/reckoner-smoke-evidence"
          export RECKONER_IMPORT_DIR="$RECKONER_EXPORT_DIR/empty-import"
          export RECKONER_RUNTIME_DIR="$RECKONER_EXPORT_DIR/empty-runtime"
          export RECKONER_BUILD_REVISION="$GITHUB_SHA"
          docker compose -p touchstone-phase1-smoke -f infra/compose.yaml down --volumes
