name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --frozen
      # Offline deployment tests render the kind refresh overlay with `kubectl kustomize`.
      - name: Install pinned kubectl v1.36.1
        run: |
          curl -fsSLo "$RUNNER_TEMP/kubectl" https://dl.k8s.io/release/v1.36.1/bin/linux/amd64/kubectl
          echo "$(curl -fsSL https://dl.k8s.io/release/v1.36.1/bin/linux/amd64/kubectl.sha256)  $RUNNER_TEMP/kubectl" | sha256sum --check
          install -m 0755 "$RUNNER_TEMP/kubectl" /usr/local/bin/kubectl
          kubectl version --client
      - run: uv run --frozen --all-packages dbt deps --project-dir platform/dbt
      - run: uv run --frozen --all-packages pytest -m 'not integration and not clickhouse_integration and not neo4j_integration' -q
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_PASSWORD: ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
          --memory 512m
    env:
      RECKONER_TEST_OWNER_DSN: postgresql://postgres:ci-disposable-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --frozen
      # Each fixture provisions isolated login roles and runs checksum-verified migrations.
      - run: uv run --frozen --all-packages pytest -m 'integration and not neo4j_integration' -q
  neo4j-integration:
    runs-on: ubuntu-latest
    needs: [test]
    env:
      RECKONER_TEST_OWNER_DSN: postgresql://postgres:reckoner-test-only@127.0.0.1:55433/postgres
      RECKONER_TEST_NEO4J_URI: bolt://127.0.0.1:57687
      # Docker names of the test project's stores for the benchmark sampler/audit steps.
      RECKONER_TEST_SAMPLE_CONTAINERS: touchstone-phase3-task3-postgres-1,touchstone-phase3-task3-neo4j-1
      RECKONER_TEST_AUDIT_PREFIX: touchstone-phase3-task3-
      RECKONER_TEST_DU_IMAGE: pgvector/pgvector:0.8.6-pg17-bookworm@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: bash infra/prepare-reckoner-v1-test.sh
      - run: docker compose -f infra/compose.reckoner-v1.test.yaml up -d --wait
      # Unavailable services fail; no integration skip path exists.
      - run: >-
          uv run --frozen --all-packages pytest workloads/reckoner/tests/test_v1_graph.py
          workloads/reckoner/tests/test_v1_smoke.py workloads/reckoner/tests/test_v1_benchmark_stores.py
          -m neo4j_integration -q
      # The rolling evidence graph refuses stores carrying test markers: recreate it empty.
      - run: docker compose -f infra/compose.reckoner-v1.test.yaml down --volumes
      - run: docker compose -f infra/compose.reckoner-v1.test.yaml up -d --wait
      - run: >-
          uv run --frozen --all-packages pytest
          workloads/reckoner/tests/test_v1_evidence_rolling_graph.py -m neo4j_integration -q
        env:
          RECKONER_TEST_EVIDENCE_NEO4J_URI: bolt://127.0.0.1:57687
      - if: always()
        run: docker compose -f infra/compose.reckoner-v1.test.yaml down --volumes
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run lint && npm run typecheck && npm run build
        working-directory: web
  platform-smoke:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - name: Fabricated OTLP-to-dashboard smoke without provider credentials
        run: bash infra/smoke-platform.sh
  image-smoke:
    runs-on: ubuntu-latest
    needs: [test, postgres-integration]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fabricated Compose smoke with zero provider credentials
        shell: bash
        run: |
          export RECKONER_SECRET_DIR="$RUNNER_TEMP/reckoner-smoke-secrets"
          export RECKONER_EXPORT_DIR="$RUNNER_TEMP/reckoner-smoke-evidence"
          python3 infra/smoke_credentials.py "$RECKONER_SECRET_DIR" --database reckoner_smoke_compose
          bash infra/smoke-compose.sh
      - name: Remove only the disposable CI project
        if: always()
        shell: bash
        run: |
          export RECKONER_SECRET_DIR="$RUNNER_TEMP/reckoner-smoke-secrets"
          export RECKONER_EXPORT_DIR="$RUNNER_TEMP/reckoner-smoke-evidence"
          export RECKONER_IMPORT_DIR="$RECKONER_EXPORT_DIR/empty-import"
          export RECKONER_RUNTIME_DIR="$RECKONER_EXPORT_DIR/empty-runtime"
          export RECKONER_BUILD_REVISION="$GITHUB_SHA"
          docker compose -p touchstone-phase1-smoke -f infra/compose.yaml down --volumes
