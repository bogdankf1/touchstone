services:
  reckoner:
    image: touchstone-reckoner:phase0
    build:
      context: ..
      dockerfile: infra/Dockerfile.reckoner
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 6
