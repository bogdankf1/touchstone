apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clickhouse-data
  namespace: touchstone-phase2-smoke
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
  namespace: touchstone-phase2-smoke
spec:
  replicas: 1
  selector:
    matchLabels: {app: clickhouse}
  template:
    metadata:
      labels: {app: clickhouse}
    spec:
      containers:
        - name: clickhouse
          image: touchstone-clickhouse:phase2
          imagePullPolicy: Never
          env:
            - {name: CLICKHOUSE_DB, value: otel}
            - {name: CLICKHOUSE_USER, value: touchstone}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef: {name: platform-db, key: password}
          ports:
            - {name: http, containerPort: 8123}
            - {name: native, containerPort: 9000}
          volumeMounts:
            - {name: data, mountPath: /var/lib/clickhouse}
            - {name: init, mountPath: /docker-entrypoint-initdb.d/01-traces.sql, subPath: init.sql, readOnly: true}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "2", memory: 2Gi}
          readinessProbe:
            exec:
              command: [sh, -c, 'clickhouse-client --user touchstone --password "$CLICKHOUSE_PASSWORD" --query "SELECT 1"']
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: clickhouse-data}
        - name: init
          configMap: {name: platform-clickhouse-init}
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: touchstone-phase2-smoke
spec:
  selector: {app: clickhouse}
  ports:
    - {name: http, port: 8123, targetPort: http}
    - {name: native, port: 9000, targetPort: native}
