apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: collector-queue
  namespace: touchstone-phase2-smoke
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: touchstone-phase2-smoke
spec:
  replicas: 1
  selector:
    matchLabels: {app: collector}
  template:
    metadata:
      labels: {app: collector}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: collector
          image: touchstone-collector:phase2
          imagePullPolicy: Never
          args: [--config=/etc/otelcol/config.yaml]
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef: {name: platform-db, key: password}
          ports:
            - {name: otlp, containerPort: 4318}
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol/config.yaml, subPath: config.yaml, readOnly: true}
            - {name: queue, mountPath: /var/lib/otelcol/storage}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 384Mi}
          readinessProbe:
            tcpSocket: {port: otlp}
            periodSeconds: 5
      volumes:
        - name: config
          configMap: {name: platform-collector-config}
        - name: queue
          persistentVolumeClaim: {claimName: collector-queue}
---
apiVersion: v1
kind: Service
metadata:
  name: collector
  namespace: touchstone-phase2-smoke
spec:
  selector: {app: collector}
  ports:
    - {name: otlp, port: 4318, targetPort: otlp}
