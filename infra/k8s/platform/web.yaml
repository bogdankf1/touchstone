apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: touchstone-phase2-smoke
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 1000}
      containers:
        - name: web
          image: touchstone-web:phase2
          imagePullPolicy: Never
          env:
            - {name: TOUCHSTONE_API_URL, value: 'http://api:8000'}
          ports:
            - {name: http, containerPort: 3000}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: touchstone-phase2-smoke
spec:
  selector: {app: web}
  ports:
    - {name: http, port: 3000, targetPort: http}
